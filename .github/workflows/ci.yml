name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  node-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          # Cache bust v1 - forcing fresh install
          cache-dependency-path: |
            backend/package-lock.json
            backend/package.json
      - name: Install Node dependencies
        run: cd backend && npm ci --verbose
      - name: Node Lint
        run: cd backend && npm run lint
      - name: Node Test
        run: cd backend && npm test

  python-backend-legacy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-backend
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: flake8 app/ --max-line-length=120
      - name: Test
        run: pytest tests/ --cov=app --cov-fail-under=80

  python-qa-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Tools
        run: pip install black flake8 mypy pytest pytest-cov
      - name: Lint (Black/Flake8)
        run: |
          cd backend
          black --check .
          flake8 .
      - name: Type Check (Mypy)
        run: |
          cd backend
          mypy src/
      - name: Tests
        run: |
          cd backend
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest --cov=src --cov-report=xml

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: TypeScript Check
        run: |
          cd ecommerce-frontend
          npm install
          npx tsc --noEmit

  docker-build:
    runs-on: ubuntu-latest
    needs: [node-quality, python-backend-legacy, python-qa-tools, frontend-quality]
    steps:
      - uses: actions/checkout@v5
      - name: Build Images
        run: |
          docker build --no-cache -f backend/Dockerfile -t backend:ci ./backend
          docker build -t python-backend:ci ./python-backend
          docker build -t frontend:ci ./ecommerce-frontend